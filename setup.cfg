[metadata]
name = Westie
version = 0.1.6
description = Generate deterministic commit-message drafts from git diffs.
long_description = file: README.md
long_description_content_type = text/markdown
author = livrasand
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
py_modules = git_text git_text_cli
python_requires = >=3.8
scripts =
    git_text_cli.py

[options.entry_points]
console_scripts =
    westie = git_text_cli:main
